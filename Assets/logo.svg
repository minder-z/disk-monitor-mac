<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4A8A"/>
      <stop offset="1" stop-color="#0A1A33"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F4F8"/>
      <stop offset="1" stop-color="#A9B4C4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hl">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角方形底板（macOS 图标网格：824×824） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <ellipse cx="512" cy="150" rx="420" ry="200" fill="url(#hl)"/>

  <!-- 速度/温度表盘 -->
  <path d="M 277 605.5 A 250 250 0 1 1 747 605.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="56" stroke-linecap="round"/>
  <path d="M 277 605.5 A 250 250 0 1 1 747 605.5" fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round"/>

  <!-- 指针 -->
  <line x1="512" y1="520" x2="665" y2="391" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <circle cx="512" cy="520" r="38" fill="#FFFFFF"/>
  <circle cx="512" cy="520" r="15" fill="#0F2547"/>

  <!-- 硬盘 -->
  <rect x="262" y="690" width="500" height="110" rx="34" fill="url(#metal)"/>
  <rect x="306" y="737" width="300" height="16" rx="8" fill="#7C8799"/>
  <circle cx="704" cy="745" r="40" fill="url(#glow)"/>
  <circle cx="704" cy="745" r="15" fill="#34D399"/>
</svg>
